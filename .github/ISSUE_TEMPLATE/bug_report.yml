name: Bug report
description: Report a defect in Uldren Application.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps that reproduce the behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Identify the release or commit where you observed the problem.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, architecture, and affected surface.
    validations:
      required: false
